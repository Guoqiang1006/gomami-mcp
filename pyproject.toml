[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gomami-mcp"
dynamic = ["version"]
description = "Unofficial MCP server for managing GoMami servers, read-only by default"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "gomami", "vps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
gomami-mcp = "gomami_mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["gomami_mcp"]

[tool.setuptools.dynamic]
version = { attr = "gomami_mcp.__version__" }
